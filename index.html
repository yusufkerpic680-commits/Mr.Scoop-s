*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:500;font-size:17px;line-height:1.25;overflow:hidden}
.app{min-height:100%;display:flex;align-items:center;justify-content:center;padding:8px}
.stage{position:relative;aspect-ratio:1024/1180;width:min(100%,calc((100vh - 24px - 2*var(--adh))*.8678));width:min(100%,calc((100dvh - 24px - 2*var(--adh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*.8678));container-type:inline-size;border-radius:16px;overflow:hidden;border:3px solid #5a3820;background:#7d4a29}
.layer{position:absolute;inset:0;pointer-events:none;background:var(--shop) no-repeat 0 0/100% 88.14%}
.back{clip-path:inset(0 0 45.76% 0);z-index:0}.front{clip-path:inset(54.24% 0 23.73% 0);z-index:2}
.ext{position:absolute;left:0;right:0;bottom:0;height:23.73%;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.18) 46px 48px),linear-gradient(#b0703f,#7d4a29);border-top:4px solid #d9a066;box-shadow:inset 0 8px 10px rgba(0,0,0,.25)}
.mat{position:absolute;left:36%;width:34%;top:88%;height:9%;border-radius:12px;background:linear-gradient(#e6ecef,#a3b0b9);border:3px solid #6c7a84;box-shadow:0 4px 0 rgba(0,0,0,.3);z-index:3}
.build{position:absolute;left:36%;width:34%;top:60%;bottom:5%;display:flex;align-items:flex-end;justify-content:center;font-size:11px;font-size:2.35cqw;z-index:4;pointer-events:none}
.slots,.tubs{position:absolute;inset:0;pointer-events:none}.slots{z-index:1}.tubs{z-index:3}
.cs{position:absolute;bottom:45.2%;width:24%;transform:translateX(-50%);pointer-events:auto;cursor:pointer}
.cs:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.pic{width:100%;display:block;transform-origin:50% 100%}
.pic.mad{filter:saturate(1.15) hue-rotate(-8deg)}
.pic.angry{animation:shk .25s linear 3}.pic.happy{animation:hop .4s ease-out 2}.pic.nope{animation:shk .25s linear 2}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes nud{50%{transform:scale(1.1)}}
.nudge{animation:nud .3s 2}
.bb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:-6px;background:#fff;color:#3a2a22;border-radius:14px;padding:4px 7px;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center;white-space:nowrap;z-index:4}
.ord{display:flex;gap:4px;justify-content:center;align-items:flex-end;font-size:15px}
.bar{height:6px;background:#e3d6c8;border-radius:9px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:#16a883}
.plus{font-weight:800;color:#16a883;font-size:18px}
.tb{position:absolute;width:14%;height:7.93%;background:none;border:0;padding:0;pointer-events:auto;cursor:pointer;border-radius:12px}
.tb img{position:absolute;left:0;bottom:0;width:100%;pointer-events:none;clip-path:inset(0 0 14% 0);transform:translateY(14%)}
.pg{position:absolute;left:50%;top:69%;transform:translateX(-50%);z-index:5;padding:2px 14px;font-size:15px}
.vs{position:relative;display:block;margin:0 auto}
.vc{position:absolute;left:50%;transform:translateX(-50%);width:4.94em;z-index:0;display:block}
.vsc{position:absolute;transform:translateX(-50%);width:6em}.vsc img{width:100%;display:block}
.vh{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:3.4em;height:1.7em;background:linear-gradient(90deg,#8d99a3,#e3eaee 45%,#8d99a3);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);z-index:9}
.vd{position:absolute;bottom:0;left:0;right:0;height:1.9em;border-radius:50%;background:radial-gradient(#fff 55%,#e4eef3);border:.15em solid #a9c3d0;box-shadow:0 .2em 0 rgba(0,0,0,.25)}
.tpo{position:absolute;left:0;top:0;width:100%;height:auto;pointer-events:none}
.eb{position:absolute;z-index:5;background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:12px}.eb svg{width:100%;height:auto}
.tops{position:absolute;left:70%;top:69%;width:17%;display:grid;grid-template-columns:1fr 1fr;gap:3px;z-index:5;justify-items:center}
.tops button{width:37px;height:44px;width:8.2cqw;height:10.6cqw;padding:2px;border-radius:10px;display:flex;align-items:center;justify-content:center}.tops button svg{width:100%;height:100%}.tops button img{width:100%;height:100%;object-fit:contain;display:block}.tops button.on{box-shadow:0 0 0 3px var(--pink)}.ti svg{width:16px;height:22px;display:block}.ti img{width:18px;height:24px;object-fit:contain;display:block}#shop{justify-content:flex-start;overflow:auto;z-index:45;background:rgba(10,6,4,.85)}#shop .panel{margin:auto 0}#away{z-index:50;background:rgba(10,6,4,.88)}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}.hud>*{pointer-events:auto}
.pill{background:rgba(42,26,18,.88);border:2px solid #d9a066;color:#fff1dc;border-radius:99px;padding:0 10px;font-weight:800;font-size:15px;display:inline-block}
.gear{padding:0 8px;font-size:16px;border-radius:99px;margin-left:4px;line-height:1.5}
button{font:inherit;font-weight:700;border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button.on{background:var(--mint);color:var(--btnink);border-color:var(--mint)}
.go{background:var(--pink);color:#fff;border-color:var(--pink)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;padding:20px}
#title{background:linear-gradient(rgba(25,12,6,.5),rgba(25,12,6,.82)),var(--shop) center/cover}
#sets{background:rgba(10,6,4,.82);z-index:40}
.tt{font-size:48px;font-weight:800;color:#fff7d6;text-shadow:0 4px 0 #8a3b22,0 8px 16px rgba(0,0,0,.5);text-align:center;line-height:1}
.sc3{display:flex;gap:6px}.sc3 img{width:84px;animation:bob 1.6s ease-in-out infinite}.sc3 img:nth-child(2){animation-delay:.25s}.sc3 img:nth-child(3){animation-delay:.5s}
.big2{font-size:26px;padding:12px 60px}.mid{font-size:20px;padding:8px 40px}
.panel{width:100%;max-width:420px;background:var(--bg);border-radius:22px;padding:16px;border:2px solid var(--line)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
h2{font-size:22px;font-weight:800;margin:0 0 6px}
.lab{color:var(--muted);font-weight:700}
.row2{display:flex;gap:8px;margin-bottom:12px}.row2 button{flex:1}
.eod{position:fixed;inset:0;background:rgba(10,6,4,.7);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
.eod .panel{margin:0 auto}
.big{font-size:30px;font-weight:800;color:var(--mint)}
.ad{width:100%;background:#ffb703;color:#2b2438;border-color:#ffb703;font-size:18px;margin:10px 0}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-top:8px}
.up b{display:block}.up small{color:var(--muted);font-size:14px}.up img{width:38px;margin-right:8px}
.up>div{display:flex;align-items:center}
.up button{background:var(--mint);color:var(--btnink);border-color:var(--mint);white-space:nowrap}
.note{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.pic,.sc3 img,.nudge{animation:none!important}}
.bn{position:fixed;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}.bn div{pointer-events:auto;width:min(320px,calc(100% - 16px));height:50px;border:2px dashed #d9a066;border-radius:6px;color:#d8bfa3;font-size:13px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}html[data-vip="1"]{--adh:0px}html[data-vip="1"] .bn{display:none}

var CHD=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],AP=[0,1,2,1,2,1,2,1],PE=[523.25,587.33,659.25,783.99,880];

 tn(c[AP[i]]*2,nT,.28,'triangle',.07,BM);
 if(i==0)tn(c[0]/2,nT,.55,'sine',.16,BM);if(i==4)tn(c[2]/2,nT,.4,'sine',.1,BM);
 if(i==2&&Math.random()<.6)tn(pick(PE),nT,.3,'sine',.05,BM);
 nT+=.2778;stp++}}

 if(k=='end'){[523.25,659.25,783.99,1046.5].forEach(function(f,j){tn(f,t+j*.13,j==3?.6:.2,'triangle',.25,BS)})}
 if(k=='start'){tn(392,t,.25,'sine',.28,BS);tn(587.33,t+.18,.4,'sine',.28,BS)}

 if(t.indexOf(2)>-1)SPR.forEach(function(p){s+='<rect x="-4" y="-1.3" width="8" height="2.6" rx="1.3" fill="'+SPC[p[3]]+'" transform="translate('+p[0]+' '+p[1]+') rotate('+p[2]+')"/>'});

  return x+'</div>'}
 var step=SHT*.5,o=.35,b0=hold?1.1:0;h=b0+(nn?(CH-o)+(nn-1)*step+SHT:CH);
 x='<div class="vs" style="width:6em;height:'+h+'em"><img class="vc" style="bottom:'+b0+'em" src="'+CN+'" alt="">'+(hold?'<div class="vh"></div>':'');
 a.forEach(function(k,j){x+='<div class="vsc" style="left:50%;bottom:'+(b0+(CH-o)+j*step)+'em;z-index:'+(j+1)+'"><img src="'+SC[k]+'" alt="">'+(j==nn-1&&tops.length?ov(tops):'')+'</div>'});
 return x+'</div>'}

  var u=0;c.o.forEach(function(x){u+=FM[x]});c.t2.forEach(function(x){u+=TP[x].p});
